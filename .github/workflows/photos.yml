name: photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: .github}
      - run: python3 .github/find_photos.py
      - run: |
          cd out && git init -q && git add -A && git -c user.name=bot -c user.email=bot@example.com commit -q -m photos
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/snapshot-tmp
