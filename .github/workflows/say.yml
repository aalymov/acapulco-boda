name: say
on: workflow_dispatch
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: .github}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: pip install -q edge-tts praat-parselmouth numpy && python3 .github/make_say.py
      - run: |
          cd out && git init -q && git add -A && git -c user.name=bot -c user.email=bot@example.com commit -q -m say
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/snapshot-tmp
