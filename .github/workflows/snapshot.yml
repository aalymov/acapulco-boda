name: snapshot
on: workflow_dispatch
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sSL "https://script.google.com/macros/s/AKfycbz1oU43zw6tRA_x4qovkVkFTqLBOk0Fpi6ffFGzWrIpmjhnJsVvzkfdww5AT8s1iTdy5g/exec" -o public.json && wc -c public.json
      - uses: actions/upload-artifact@v4
        with: {name: public, path: public.json, retention-days: 1}
