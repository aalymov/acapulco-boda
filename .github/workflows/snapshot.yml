name: snapshot
on: workflow_dispatch
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL "https://script.google.com/macros/s/AKfycbz1oU43zw6tRA_x4qovkVkFTqLBOk0Fpi6ffFGzWrIpmjhnJsVvzkfdww5AT8s1iTdy5g/exec" -o public.json
          git init -q s && mv public.json s/ && cd s
          git -c user.name=bot -c user.email=bot@example.com commit -q --allow-empty -m init
          git add public.json && git -c user.name=bot -c user.email=bot@example.com commit -q -m snapshot
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/snapshot-tmp
